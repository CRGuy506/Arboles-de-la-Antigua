name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - Website/LandingPage/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    environment: production

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Missing required secret: DEPLOY_PATH"
            exit 1
          fi
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "Missing required secret: HEALTHCHECK_URL"
            exit 1
          fi

      - name: Validate first-run bootstrap prerequisite
        run: |
          set -euo pipefail
          if [ -d "${DEPLOY_PATH}" ] && find "${DEPLOY_PATH}" -mindepth 1 -print -quit | grep -q .; then
            exit 0
          fi

          echo "${DEPLOY_PATH} is empty. The first production deployment requires a one-time manual bootstrap from the private repository before the health check can pass."
          echo "Run this on ADLA-VM, then rerun the workflow:"
          echo "export GIT_SSH_COMMAND='ssh -i ~/.ssh/adla_deploy_key -o IdentitiesOnly=yes'; rm -rf /tmp/adla-repo; git clone --depth 1 --filter=blob:none --sparse git@github.com:CRGuy506/Arboles-de-la-Antigua.git /tmp/adla-repo; cd /tmp/adla-repo; git sparse-checkout set Website/LandingPage; sudo rsync -a --delete Website/LandingPage/ /var/www/site/; cd /; rm -rf /tmp/adla-repo"
          exit 1

      - name: Build deploy artifact
        run: |
          set -euo pipefail
          if ! command -v rsync >/dev/null 2>&1; then
            echo "Missing dependency on runner: rsync"
            echo "Install it on ADLA-VM: sudo apt update ; sudo apt install -y rsync"
            exit 1
          fi
          mkdir -p /tmp/landing-site
          rsync -a --delete \
            --exclude 'Extras/' \
            --exclude 'README.md' \
            --exclude 'ARCHITECTURE.md' \
            Website/LandingPage/ /tmp/landing-site/
          tar -C /tmp/landing-site -czf /tmp/landing-site.tgz .
          sha256sum /tmp/landing-site.tgz | awk '{print $1}' > /tmp/landing-site.tgz.sha256

      - name: Deploy locally on self-hosted runner
        id: deploy
        run: |
          set -euo pipefail

          case "${DEPLOY_PATH}" in
            ''|/|/var|/etc|/usr|/bin|/sbin|/home)
              echo 'Refusing unsafe DEPLOY_PATH'
              exit 1
              ;;
          esac

          if [ -s /tmp/landing-site.tgz.sha256 ]; then
            expected_checksum="$(cat /tmp/landing-site.tgz.sha256)"
            actual_checksum="$(sha256sum /tmp/landing-site.tgz | awk '{print $1}')"
            if [ "${expected_checksum}" != "${actual_checksum}" ]; then
              echo 'Artifact checksum validation failed'
              exit 1
            fi
          else
            echo 'Missing checksum file'
            exit 1
          fi

          backup_file='none'
          if [ -d "${DEPLOY_PATH}" ] && find "${DEPLOY_PATH}" -mindepth 1 -print -quit | grep -q .; then
            backup_file="/tmp/landing-site-backup-$(date +%Y%m%d%H%M%S).tgz"
            sudo /usr/bin/tar -C "${DEPLOY_PATH}" -czf "${backup_file}" .
            ls -1t /tmp/landing-site-backup-*.tgz 2>/dev/null | tail -n +4 | xargs -r rm -f
          fi
          printf '%s\n' "${backup_file}" > /tmp/landing-site-last-backup-path.txt

          sudo /usr/bin/install -d -m 0755 "${DEPLOY_PATH}"
          sudo /usr/bin/find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          sudo /usr/bin/tar -xzf /tmp/landing-site.tgz -C "${DEPLOY_PATH}"
          rm -f /tmp/landing-site.tgz /tmp/landing-site.tgz.sha256
          sudo /usr/sbin/nginx -t
          sudo /bin/systemctl reload nginx

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          target_url="${HEALTHCHECK_URL}"
          echo "Running health check against ${target_url}"
          curl --fail --show-error --silent --location --retry 4 --retry-delay 3 --max-time 20 \
            --user-agent 'Mozilla/5.0 (compatible; GitHubActionsHealthCheck/1.0)' \
            "${target_url}" >/dev/null

      - name: Roll back on failure
        id: rollback
        if: ${{ failure() }}
        run: |
          set -euo pipefail

          backup_file="none"
          if [ -f /tmp/landing-site-last-backup-path.txt ]; then
            backup_file="$(cat /tmp/landing-site-last-backup-path.txt)"
          fi

          if [ "${backup_file}" = 'none' ] || [ ! -f "${backup_file}" ]; then
            echo 'No backup artifact found; skipping rollback'
            exit 0
          fi

          sudo /usr/bin/install -d -m 0755 "${DEPLOY_PATH}"
          sudo /usr/bin/find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          sudo /usr/bin/tar -xzf "${backup_file}" -C "${DEPLOY_PATH}"
          sudo /usr/sbin/nginx -t
          sudo /bin/systemctl reload nginx

      - name: Health check after rollback
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        run: |
          set -euo pipefail
          target_url="${HEALTHCHECK_URL}"
          echo "Running rollback health check against ${target_url}"
          curl --fail --show-error --silent --location --retry 4 --retry-delay 3 --max-time 20 \
            --user-agent 'Mozilla/5.0 (compatible; GitHubActionsHealthCheck/1.0)' \
            "${target_url}" >/dev/null
